<!doctype html><meta charset="UTF-8"><title>PCM recorder verification</title><button id="run">Test synthetic audio capture</button><pre id="result">No microphone is used. A generated tone tests the capture and WAV decoder.</pre><audio id="playback" controls></audio><script src="../features/english/english-recorder.js"></script><script>
document.querySelector('#run').onclick=async()=>{const result=document.querySelector('#result');let source;try{source=new AudioContext();await source.resume();const osc=source.createOscillator(),gain=source.createGain(),out=source.createMediaStreamDestination();gain.gain.value=.2;osc.connect(gain).connect(out);osc.start();const original=navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);navigator.mediaDevices.getUserMedia=async()=>out.stream;let recorder;try{recorder=await EnglishRecorder.start()}finally{navigator.mediaDevices.getUserMedia=original}await new Promise(r=>setTimeout(r,600));const captured=await recorder.stop();osc.stop();const decoded=await source.decodeAudioData(await captured.blob.arrayBuffer());const player=document.querySelector('#playback');player.src=URL.createObjectURL(captured.blob);player.muted=true;await player.play();result.textContent=JSON.stringify({status:decoded.duration>.2&&captured.peak>.1?'PASS':'FAIL',mime:captured.blob.type,bytes:captured.blob.size,duration:decoded.duration,peak:captured.peak,decodedChannels:decoded.numberOfChannels,playbackStarted:!player.paused,microphoneUsed:false},null,2);await source.close()}catch(e){result.textContent='FAIL: '+e.message;await source?.close()}};
</script>
